name: jr_call
description: "JR CALL - Global Voice, Video, Messaging and Creator Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ============================================================
  # FIREBASE
  # ============================================================
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.1.6
  firebase_storage: ^12.4.10

  # ============================================================
  # WEBRTC / CALL ENGINE
  # ============================================================
  flutter_webrtc: ^1.5.2

  # ============================================================
  # NETWORK
  # ============================================================
  http: ^1.5.0
  connectivity_plus: ^6.1.5

  # ============================================================
  # STATE MANAGEMENT
  # ============================================================
  flutter_riverpod: ^2.6.1

  # ============================================================
  # AUTH / USER INPUT
  # ============================================================
  country_picker: ^2.0.27
  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1

  # ============================================================
  # PROFILE MEDIA
  # ============================================================
  image_picker: 1.1.2
  image_cropper: ^12.2.1

  # ============================================================
  # PERMISSIONS
  # ============================================================
  permission_handler: ^12.0.1

  # ============================================================
  # UTILITIES
  # ============================================================
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png